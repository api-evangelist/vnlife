apis:
- name: VNPAY Payment Gateway
  description: >-
    The VNPAY-QR payment gateway (vpcpay) processes card, QR, ATM/bank-account
    and international-card payments via a browser redirect plus server-to-server
    IPN callback. Requests carry vnp_ parameters signed with an HMAC-SHA512
    vnp_SecureHash; a merchant web API supports transaction query and refund.
  humanURL: https://sandbox.vnpayment.vn/apis/
