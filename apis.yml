aid: vnlife
name: VNLIFE
description: >-
  VNLIFE is the Vietnamese technology and financial-services holding group whose
  flagship business is VNPAY (Vietnam Payment Solution Joint Stock Company), the
  leading electronic-payment provider in Vietnam. VNLIFE operates a payments and
  lifestyle ecosystem spanning the VNPAY-QR payment gateway (integrated across
  40+ banks and 15+ e-wallets), SmartPOS/PhonePOS acceptance hardware, the VNPAY
  super-app, VnShop e-commerce, taxi booking, e-invoicing, and B2B payment
  platforms serving 350,000+ merchants, 450,000+ acceptance points, and 60M+
  users. The VNPAY payment gateway is exposed as a documented redirect/IPN HTTP
  API (VNPAY-QR / vpcpay) secured with HMAC-SHA512 checksums. VNLIFE is backed by
  investors including SoftBank Vision Fund and GIC.
